version: 2
updates:
  # .NET / NuGet packages across the whole solution
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - nuget
    # Keep Microsoft.OpenApi pinned at 2.11.0. Dependabot will not propose
    # versions above that, and NuGet updates that require a newer Microsoft.OpenApi
    # will remain unresolvable and therefore won't be raised as update PRs.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        versions:
          - "> 2.11.0"
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      test-libraries:
        patterns:
          - "TUnit*"
          - "Microsoft.NET.Test.*"
          - "coverlet.*"

  # Frontend npm dependencies
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
      vite-tooling:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "vitest*"
          - "typescript"
          - "@types/*"

  # GitHub Actions used in workflows (keeps the SHA-pinned actions current)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # Base images referenced from the Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
