version: 2
updates:
  # .NET / NuGet packages across the whole solution
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - nuget
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      test-libraries:
        patterns:
          - "TUnit*"
          - "Microsoft.NET.Test.*"
          - "coverlet.*"

  # GitHub Actions used in workflows (keeps the SHA-pinned actions current)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # Base images referenced from the Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
