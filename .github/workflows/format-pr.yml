name: Auto-format PR

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/daily-crossword.yml'
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/daily-crossword.yml'

permissions:
  contents: read

jobs:
  format-pr:
    name: Format PR branch
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Apply formatting
        run: |
          set -euo pipefail
          dotnet format whitespace --no-restore
          dotnet format style --no-restore

      - name: Commit formatting changes
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "style: auto-format code with dotnet format"
            git push
          else
            echo "No formatting changes needed"
          fi

  format-pr-dependabot:
    name: Format Dependabot PR branch
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Dependabot PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Apply formatting
        run: |
          set -euo pipefail
          dotnet format whitespace --no-restore
          dotnet format style --no-restore

      - name: Commit formatting changes
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "style: auto-format code with dotnet format"
            git push
          else
            echo "No formatting changes needed"
          fi
