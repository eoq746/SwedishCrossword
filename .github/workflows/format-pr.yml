name: Auto-format PR

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/daily-crossword.yml'

permissions:
  contents: read

jobs:
  format-pr:
    name: Format PR branch
    if: github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Apply formatting
        run: |
          set -euo pipefail
          dotnet format whitespace --no-restore
          dotnet format style --no-restore

      - name: Enforce CRLF for frontend files
        run: |
          set -euo pipefail
          if [ -d frontend ]; then
            git ls-files -z frontend | while IFS= read -r -d '' file; do
              sed -i 's/\r$//' "$file"
              sed -i 's/$/\r/' "$file"
            done
          fi

      - name: Commit formatting changes
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"

          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi

          git commit -m "style: auto-format code with dotnet format"
          git push "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git" "HEAD:${{ github.event.pull_request.head.ref }}"
  prepare-dependabot-format-patch:
    name: Prepare Dependabot format patch
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Apply formatting
        run: |
          set -euo pipefail
          dotnet format whitespace --no-restore
          dotnet format style --no-restore

      - name: Enforce CRLF for frontend files
        run: |
          set -euo pipefail
          if [ -d frontend ]; then
            git ls-files -z frontend | while IFS= read -r -d '' file; do
              sed -i 's/\r$//' "$file"
              sed -i 's/$/\r/' "$file"
            done
          fi

      - name: Create patch artifact
        run: |
          set -euo pipefail
          mkdir -p .format-artifact/files
          echo "${{ github.event.pull_request.number }}" > .format-artifact/pr_number
          echo "${{ github.event.pull_request.head.ref }}" > .format-artifact/head_ref
          echo "${{ github.event.pull_request.head.sha }}" > .format-artifact/head_sha
          echo "${{ github.event.pull_request.head.repo.full_name }}" > .format-artifact/head_repo
          echo "${{ github.actor }}" > .format-artifact/actor

          if [ -n "$(git status --porcelain)" ]; then
            echo "true" > .format-artifact/has_changes
            git diff --name-only > .format-artifact/changed_files.txt

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              mkdir -p ".format-artifact/files/$(dirname "$file")"
              cp -- "$file" ".format-artifact/files/$file"
            done < .format-artifact/changed_files.txt
          else
            echo "false" > .format-artifact/has_changes
            : > .format-artifact/changed_files.txt
          fi

      - name: Upload format artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-format-${{ github.event.pull_request.number }}
          path: .format-artifact/
          retention-days: 3
