name: Apply Dependabot format patch

on:
  workflow_run:
    workflows: ["Auto-format PR"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  apply-dependabot-format:
    name: Apply Dependabot format patch
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Download artifact from triggering run
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          pattern: dependabot-format-*
          path: .download
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Locate artifact root
        id: locate
        if: steps.download.outcome == 'success'
        run: |
          set -euo pipefail

          if [ ! -d .download ]; then
            echo "No downloaded artifact directory found. Skipping apply workflow."
            echo "artifact_root=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ARTIFACT_ROOT=$(find .download -type f -name head_sha -exec dirname {} \; | head -1)
          if [ -z "${ARTIFACT_ROOT:-}" ]; then
            echo "No matching Dependabot format artifact metadata found. Skipping apply workflow."
            find .download -maxdepth 3 -type f | sort || true
            echo "artifact_root=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "artifact_root=$ARTIFACT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Validate run and artifact metadata
        id: meta
        if: steps.locate.outputs.artifact_root != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          ARTIFACT_ROOT: ${{ steps.locate.outputs.artifact_root }}
        run: |
          set -euo pipefail

          RUN_ACTOR=$(gh api repos/$REPO/actions/runs/$RUN_ID --jq '.actor.login')
          ARTIFACT_HEAD_SHA=$(cat "$ARTIFACT_ROOT/head_sha")
          ARTIFACT_HEAD_REPO=$(cat "$ARTIFACT_ROOT/head_repo")
          HAS_CHANGES=$(cat "$ARTIFACT_ROOT/has_changes")

          if [ "$RUN_ACTOR" != "dependabot[bot]" ]; then
            echo "Run actor is not Dependabot. Skipping."
            exit 0
          fi

          if [ "$ARTIFACT_HEAD_REPO" != "$REPO" ]; then
            echo "Artifact repo mismatch. Skipping."
            exit 0
          fi

          if [[ "$RUN_HEAD_BRANCH" != dependabot/* ]]; then
            echo "Run branch is not a Dependabot branch. Skipping."
            exit 0
          fi

          if [ "$ARTIFACT_HEAD_SHA" != "$RUN_HEAD_SHA" ]; then
            echo "Artifact sha mismatch. Skipping to avoid stale apply."
            exit 0
          fi

          if [ "$HAS_CHANGES" != "true" ]; then
            echo "No formatting changes in artifact."
            exit 0
          fi

          echo "head_ref=$RUN_HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Dependabot branch
        if: steps.meta.outputs.head_ref != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ steps.meta.outputs.head_sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Apply formatted files and push
        if: steps.meta.outputs.head_ref != ''
        env:
          ARTIFACT_ROOT: ${{ steps.locate.outputs.artifact_root }}
          HEAD_REF: ${{ steps.meta.outputs.head_ref }}
          REPO: ${{ github.repository }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          APPLIED_COUNT=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue

            SOURCE_FILE="$ARTIFACT_ROOT/files/$file"
            if [ ! -f "$SOURCE_FILE" ]; then
              echo "Missing artifact file for: $file"
              exit 1
            fi

            mkdir -p "$(dirname "$file")"
            cp -- "$SOURCE_FILE" "$file"
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
          done < "$ARTIFACT_ROOT/changed_files.txt"

          if [ "$APPLIED_COUNT" -eq 0 ]; then
            echo "No files to apply."
            exit 0
          fi

          case "$HEAD_REF" in
            ""|*..*|*~*|*^*|*:*|*\\*|*@\{*|*.lock|/*|*/ )
              echo "Unsafe or invalid head ref: $HEAD_REF"
              exit 1
              ;;
          esac
          if ! printf '%s' "$HEAD_REF" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "Unsafe characters in head ref: $HEAD_REF"
            exit 1
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add -A
          if git diff --cached --quiet; then
            echo "No commit needed after staging."
            exit 0
          fi

          git commit -m "style: auto-format code with dotnet format"
          git push "https://x-access-token:${APP_TOKEN}@github.com/$REPO.git" "HEAD:$HEAD_REF"

          echo "Applied and pushed formatting updates to $APPLIED_COUNT file(s)."