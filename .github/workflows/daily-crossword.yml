name: Daily Crossword Generator

on:
  schedule:
    # Run at midnight UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: gh-pages

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Verify Data files exist
        run: |
          echo "Working directory: $(pwd)"
          echo "Checking for dictionary files..."
          ls -la SwedishCrossword/Data/ || echo "Data directory not found!"
          if [ -f "SwedishCrossword/Data/lexin-words.json" ]; then
            echo "lexin-words.json found ($(wc -c < SwedishCrossword/Data/lexin-words.json) bytes)"
          else
            echo "ERROR: lexin-words.json not found!"
          fi
          if [ -f "SwedishCrossword/Data/synonym-words.json" ]; then
            echo "synonym-words.json found ($(wc -c < SwedishCrossword/Data/synonym-words.json) bytes)"
          else
            echo "ERROR: synonym-words.json not found!"
          fi
          if [ -f "SwedishCrossword/Data/kelly-words.json" ]; then
            echo "kelly-words.json found ($(wc -c < SwedishCrossword/Data/kelly-words.json) bytes)"
          else
            echo "ERROR: kelly-words.json not found!"
          fi
          if [ -f "SwedishCrossword/Data/custom-words.json" ]; then
            echo "custom-words.json found ($(wc -c < SwedishCrossword/Data/custom-words.json) bytes)"
          else
            echo "ERROR: custom-words.json not found!"
          fi
          if [ -f "SwedishCrossword/Data/dsso-words.json" ]; then
            echo "dsso-words.json found ($(wc -c < SwedishCrossword/Data/dsso-words.json) bytes)"
          else
            echo "ERROR: dsso-words.json not found!"
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Restore word analysis cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: SwedishCrossword/.cache
          key: word-analysis-${{ runner.os }}-sha-${{ hashFiles('SwedishCrossword/Data/lexin-words.json','SwedishCrossword/Data/synonym-words.json','SwedishCrossword/Data/kelly-words.json','SwedishCrossword/Data/dsso-words.json','SwedishCrossword/Data/custom-words.json') }}

      - name: Set cache env
        run: echo "SWEDISH_CROSSWORD_CACHE_PATH=SwedishCrossword/.cache" >> $GITHUB_ENV

      - name: Run tests
        run: dotnet test SwedishCrossword.Tests/SwedishCrossword.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Generate crossword
        run: dotnet run --project SwedishCrossword/SwedishCrossword.csproj --configuration Release -- --generate-for-web
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false

      - name: Prepare GitHub Pages content
        run: |
          mkdir -p _site
          cp SwedishCrossword/wwwroot/index.html _site/
          cp SwedishCrossword/wwwroot/site.min.css _site/
          cp SwedishCrossword/wwwroot/site.js _site/
          cp SwedishCrossword/wwwroot/puzzle.json _site/ 2>/dev/null || echo "puzzle.json not found, will use default"
          # Copy additional pages
          cp SwedishCrossword/wwwroot/om-oss.html _site/
          cp SwedishCrossword/wwwroot/kontakt.html _site/
          cp SwedishCrossword/wwwroot/integritetspolicy.html _site/
          # Copy SEO files
          cp SwedishCrossword/wwwroot/sitemap.xml _site/
          cp SwedishCrossword/wwwroot/robots.txt _site/
          # Copy favicon and icons
          cp SwedishCrossword/wwwroot/favicon.ico _site/
          cp SwedishCrossword/wwwroot/favicon-16x16.png _site/
          cp SwedishCrossword/wwwroot/favicon-32x32.png _site/
          cp SwedishCrossword/wwwroot/apple-touch-icon.png _site/
          cp SwedishCrossword/wwwroot/android-chrome-192x192.png _site/
          cp SwedishCrossword/wwwroot/android-chrome-512x512.png _site/
          cp SwedishCrossword/wwwroot/site.webmanifest _site/
          # Copy CNAME file for custom domain
          cp SwedishCrossword/wwwroot/CNAME _site/
          # Add a .nojekyll file to prevent Jekyll processing
          touch _site/.nojekyll
          echo "Contents of _site:"
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202571b3025aec15e3e5e2e29d4a0 # v3.0.1
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
