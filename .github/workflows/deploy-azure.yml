name: Deploy to Azure Container Apps

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - '.github/workflows/daily-crossword.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-svensktkorsord
  LOCATION: swedencentral
  APP_NAME: svensktkorsord

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Azure Login (OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ------------------------------------------------------------------
      # 1. Provision infrastructure WITHOUT imageTag (uses placeholder image)
      # ------------------------------------------------------------------
      - name: Upgrade Bicep CLI
        run: az bicep upgrade

      - name: Create Resource Group
        run: az group create --name $RESOURCE_GROUP --location $LOCATION

      - name: Deploy Infrastructure (Bicep)
        id: infra
        env:
          SUBMISSION_TOKEN_SECRET: ${{ secrets.SUBMISSION_TOKEN_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
        run: |
          RESULT=$(az deployment group create \
            --resource-group $RESOURCE_GROUP \
            --template-file infra/main.bicep \
            --parameters appName=$APP_NAME createRoleAssignment=false \
              submissionTokenSecret="$SUBMISSION_TOKEN_SECRET" \
              googleClientId="$GOOGLE_CLIENT_ID" \
              googleClientSecret="$GOOGLE_CLIENT_SECRET" \
              microsoftClientId="$MICROSOFT_CLIENT_ID" \
              microsoftClientSecret="$MICROSOFT_CLIENT_SECRET" \
              adminUserIds="$ADMIN_USER_IDS" \
            --query 'properties.outputs' \
            --output json)

          ACR_NAME=$(echo "$RESULT" | jq -r '.acrName.value')
          ACR_LOGIN=$(echo "$RESULT" | jq -r '.acrLoginServer.value' | tr -d '\n')
          APP_URL=$(echo "$RESULT" | jq -r '.appUrl.value')

          APP_FQDN=$(echo "$RESULT" | jq -r '.appFqdn.value')
          DOMAIN_VERIFICATION_ID=$(echo "$RESULT" | jq -r '.customDomainVerificationId.value')
          ENV_NAME=$(echo "$RESULT" | jq -r '.environmentName.value')

          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login=$ACR_LOGIN" >> "$GITHUB_OUTPUT"
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "app_fqdn=$APP_FQDN" >> "$GITHUB_OUTPUT"
          echo "domain_verification_id=$DOMAIN_VERIFICATION_ID" >> "$GITHUB_OUTPUT"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 2. Build & push container image
      # ------------------------------------------------------------------
      - name: Build & Push Image
        run: |
          az acr build \
            --registry ${{ steps.infra.outputs.acr_name }} \
            --image $APP_NAME:${{ github.sha }} \
            --image $APP_NAME:latest \
            .

      # ------------------------------------------------------------------
      # 3. Update the Container App to the new image
      # ------------------------------------------------------------------
      - name: Deploy Container App
        run: |
          IMAGE_URI="${{ steps.infra.outputs.acr_login }}/$APP_NAME:${{ github.sha }}"
          echo "Deploying image: $IMAGE_URI"
          az containerapp update \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image "$IMAGE_URI" \
            --set-env-vars \
              "SubmissionToken__Secret=secretref:submissiontoken-secret" \
              "Authentication__Google__ClientId=secretref:google-client-id" \
              "Authentication__Google__ClientSecret=secretref:google-client-secret" \
              "Authentication__Microsoft__ClientId=secretref:microsoft-client-id" \
              "Authentication__Microsoft__ClientSecret=secretref:microsoft-client-secret"

      # ------------------------------------------------------------------
      # 4. Bind custom domain (if CUSTOM_DOMAIN secret is set)
      # ------------------------------------------------------------------
      - name: Bind Custom Domain
        if: env.CUSTOM_DOMAIN != ''
        run: |
          DOMAIN="$CUSTOM_DOMAIN"
          echo "🌐 Binding custom domain: $DOMAIN"
          echo "   App FQDN: ${{ steps.infra.outputs.app_fqdn }}"
          echo "   Verification ID: ${{ steps.infra.outputs.domain_verification_id }}"

          # Add hostname (idempotent — skips if already added)
          az containerapp hostname add \
            --hostname "$DOMAIN" \
            --resource-group $RESOURCE_GROUP \
            --name $APP_NAME 2>/dev/null || true

          # Bind managed certificate (idempotent — skips if already bound)
          az containerapp hostname bind \
            --hostname "$DOMAIN" \
            --resource-group $RESOURCE_GROUP \
            --name $APP_NAME \
            --environment ${{ steps.infra.outputs.env_name }} \
            --validation-method CNAME

          echo "✅ Custom domain bound with managed certificate"
        env:
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}

      # ------------------------------------------------------------------
      # 5. Verify deployment
      # ------------------------------------------------------------------
      - name: Verify Health
        run: |
          APP_URL="${{ steps.infra.outputs.app_url }}"
          echo "🚀 Deployed to: $APP_URL"

          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "  Waiting for health check... (attempt $i, status: $STATUS)"
            sleep 5
          done

          echo "⚠️ Health check did not return 200 within 60s (last status: $STATUS)"
          echo "  The app may still be starting up — check the Azure portal."