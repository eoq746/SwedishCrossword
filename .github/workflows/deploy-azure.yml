name: Deploy to Azure Container Apps

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/daily-crossword.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/daily-crossword.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-svensktkorsord
  LOCATION: swedencentral
  APP_NAME: svensktkorsord
  CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}

jobs:
  # ----------------------------------------------------------------------
  # Preflight quality gate: format, build, test, and vulnerability check.
  # Deploy is skipped when any of these fail.
  # ----------------------------------------------------------------------
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Format code (whitespace + style)
        run: |
          set -euo pipefail
          dotnet format whitespace --no-restore
          dotnet format style --no-restore

      - name: Commit formatting changes
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "📝 Formatting changes detected, committing..."
            git add -A
            git commit -m "style: auto-format code with dotnet format"
            git push
          else
            echo "✅ No formatting changes needed"
          fi

      - name: Verify formatting (final check)
        run: |
          set -euo pipefail
          dotnet format whitespace --verify-no-changes --no-restore
          dotnet format style --verify-no-changes --no-restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test --configuration Release --no-build --verbosity minimal

      - name: Check for vulnerable NuGet packages
        run: |
          set -euo pipefail
          OUTPUT=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable packages detected. See output above."
            exit 1
          fi

  # ----------------------------------------------------------------------
  # Secret scan: gitleaks across full history on every push/PR.
  # ----------------------------------------------------------------------
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  build-and-deploy:
    # Only deploy on direct pushes to master (i.e. after PR squash-merge).
    # PR runs of this workflow stop after test + secret-scan.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Serialize deployments so two pushes in quick succession don't race on
    # the same resource group / Container App revision. Scoped to this job
    # only so PR runs of `test` and `secret-scan` are never blocked by an
    # in-progress deploy on master.
    concurrency:
      group: deploy-azure-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Azure login with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Select subscription (if provided)
        run: |
          if [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          else
            echo "AZURE_SUBSCRIPTION_ID not set; listing subscriptions available to the identity"
            az account list -o table
          fi
      # ------------------------------------------------------------------
      # 1. Provision infrastructure WITHOUT imageTag (uses placeholder image)
      # ------------------------------------------------------------------
      - name: Upgrade Bicep CLI
        run: az bicep upgrade

      - name: Create Resource Group
        run: az group create --name $RESOURCE_GROUP --location $LOCATION

      - name: Deploy Infrastructure (Bicep)
        id: infra
        env:
          SUBMISSION_TOKEN_SECRET: ${{ secrets.SUBMISSION_TOKEN_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          FORWARDED_TRUSTED_PROXIES_JSON: ${{ secrets.FORWARDED_TRUSTED_PROXIES_JSON }}
          FORWARDED_TRUSTED_NETWORKS_JSON: ${{ secrets.FORWARDED_TRUSTED_NETWORKS_JSON }}
        run: |
          set -euo pipefail
          # Discover the Container Apps environment static outbound IP if the
          # environment already exists. On a brand-new deploy this returns
          # empty, which Bicep handles by skipping the firewall rule on the
          # first pass; the second deploy run will pin it.
          ENV_IP=$(az containerapp env show \
            --resource-group $RESOURCE_GROUP \
            --name ${APP_NAME}-env \
            --query properties.staticIp \
            --output tsv 2>/dev/null || echo '')
          echo "Container App env outbound IP: ${ENV_IP:-<not yet provisioned>}"

          PARAMS=(
            appName=$APP_NAME
            createRoleAssignment=false
            enableResourceGroupLock=false
            containerAppOutboundIp="$ENV_IP"
            submissionTokenSecret="$SUBMISSION_TOKEN_SECRET"
            googleClientId="$GOOGLE_CLIENT_ID"
            googleClientSecret="$GOOGLE_CLIENT_SECRET"
            microsoftClientId="$MICROSOFT_CLIENT_ID"
            microsoftClientSecret="$MICROSOFT_CLIENT_SECRET"
            adminUserIds="$ADMIN_USER_IDS"
          )

          # Optional explicit forwarded-header trust lists.
          # Expected secret format: JSON array, e.g. ["203.0.113.10"]
          # and ["10.20.0.0/24"].
          if [ -n "${FORWARDED_TRUSTED_PROXIES_JSON:-}" ]; then
            PARAMS+=(forwardedHeadersTrustedProxies="$FORWARDED_TRUSTED_PROXIES_JSON")
          fi
          if [ -n "${FORWARDED_TRUSTED_NETWORKS_JSON:-}" ]; then
            PARAMS+=(forwardedHeadersTrustedNetworks="$FORWARDED_TRUSTED_NETWORKS_JSON")
          fi

          RESULT=$(az deployment group create \
            --resource-group $RESOURCE_GROUP \
            --template-file infra/main.bicep \
            --only-show-errors \
            --parameters "${PARAMS[@]}" \
            --query 'properties.outputs' \
            --output json)

          ACR_NAME=$(echo "$RESULT" | jq -r '.acrName.value')
          ACR_LOGIN=$(echo "$RESULT" | jq -r '.acrLoginServer.value' | tr -d '\n')
          APP_URL=$(echo "$RESULT" | jq -r '.appUrl.value')

          APP_FQDN=$(echo "$RESULT" | jq -r '.appFqdn.value')
          DOMAIN_VERIFICATION_ID=$(echo "$RESULT" | jq -r '.customDomainVerificationId.value')
          ENV_NAME=$(echo "$RESULT" | jq -r '.environmentName.value')

          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login=$ACR_LOGIN" >> "$GITHUB_OUTPUT"
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "app_fqdn=$APP_FQDN" >> "$GITHUB_OUTPUT"
          echo "domain_verification_id=$DOMAIN_VERIFICATION_ID" >> "$GITHUB_OUTPUT"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 2. Generate SBOM (EU Cyber Resilience Act compliance)
      # ------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Generate SBOM
        env:
          SBOM_TOOL_VERSION: "3.1.0"
        run: |
          dotnet publish SwedishCrossword.Api -c Release -o ./publish --nologo
          curl -Lo sbom-tool "https://github.com/microsoft/sbom-tool/releases/download/v${SBOM_TOOL_VERSION}/sbom-tool-linux-x64"
          chmod +x sbom-tool
          mkdir -p ./sbom-output
          ./sbom-tool generate \
            -b ./publish \
            -bc . \
            -pn SwedishCrossword \
            -pv "${{ github.sha }}" \
            -ps SwedishCrossword \
            -nsb "https://github.com/eoq746/SwedishCrossword" \
            -m ./sbom-output \
            -mi "SPDX:2.2"
          rm -rf ./publish

      - name: Generate human-readable SBOM formats
        run: |
          pip install sbom2doc==0.5.1 --quiet
          MANIFEST=$(find ./sbom-output -name "manifest.spdx.json" | head -1)
          sbom2doc -i "$MANIFEST" -o "${MANIFEST}.md" -f markdown
          sbom2doc -i "$MANIFEST" -o "${MANIFEST}.html" -f html

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: sbom-output/_manifest/spdx_2.2/
          retention-days: 90

      # ------------------------------------------------------------------
      # 3. Build & push container image
      # ------------------------------------------------------------------
      - name: Build & Push Image
        run: |
          az acr build \
            --registry ${{ steps.infra.outputs.acr_name }} \
            --image $APP_NAME:${{ github.sha }} \
            --image $APP_NAME:latest \
            .

      # ------------------------------------------------------------------
      # 4. Wait for SQL DB to settle. The first Bicep deploy returns as soon
      #    as the ARM deployment finishes, but the underlying serverless
      #    Free-tier DB may still be provisioning. Re-issuing a PATCH against
      #    a DB whose previous operation hasn't completed yields
      #    `ConflictingDatabaseOperation`. Poll until status == Online.
      # ------------------------------------------------------------------
      - name: Wait for SQL DB Online
        run: |
          set -euo pipefail
          SQL_SERVER=$(az sql server list \
            --resource-group $RESOURCE_GROUP \
            --query "[?starts_with(name, '$APP_NAME-sql-')].name | [0]" \
            -o tsv)
          if [ -z "$SQL_SERVER" ]; then
            echo "No SQL server found — skipping wait."
            exit 0
          fi
          DB_NAME="$APP_NAME-db"
          echo "Waiting for $SQL_SERVER/$DB_NAME to reach Online..."
          for i in $(seq 1 60); do
            STATUS=$(az sql db show \
              --resource-group $RESOURCE_GROUP \
              --server "$SQL_SERVER" \
              --name "$DB_NAME" \
              --query "status" -o tsv 2>/dev/null || echo "Unknown")
            echo "  attempt $i: status=$STATUS"
            if [ "$STATUS" = "Online" ] || [ "$STATUS" = "AutoClosed" ] || [ "$STATUS" = "Paused" ]; then
              echo "✅ SQL DB ready (status=$STATUS)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::SQL DB did not reach Online within 10 minutes (last status: $STATUS)"
          exit 1

      # ------------------------------------------------------------------
      # 5. Re-deploy Bicep with imageTag so the Container App points at the
      #    newly-pushed image and the health probes get attached (probes are
      #    skipped in the placeholder-image deploy above).
      # ------------------------------------------------------------------
      - name: Deploy Container App (Bicep, real image)
        env:
          SUBMISSION_TOKEN_SECRET: ${{ secrets.SUBMISSION_TOKEN_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          FORWARDED_TRUSTED_PROXIES_JSON: ${{ secrets.FORWARDED_TRUSTED_PROXIES_JSON }}
          FORWARDED_TRUSTED_NETWORKS_JSON: ${{ secrets.FORWARDED_TRUSTED_NETWORKS_JSON }}
        run: |
          set -euo pipefail
          ENV_IP=$(az containerapp env show \
            --resource-group $RESOURCE_GROUP \
            --name ${APP_NAME}-env \
            --query properties.staticIp \
            --output tsv 2>/dev/null || echo '')
          echo "Container App env outbound IP: ${ENV_IP:-<not yet provisioned>}"

          PARAMS=(
            appName=$APP_NAME
            createRoleAssignment=false
            enableResourceGroupLock=false
            containerAppOutboundIp="$ENV_IP"
            imageTag="${{ github.sha }}"
            submissionTokenSecret="$SUBMISSION_TOKEN_SECRET"
            googleClientId="$GOOGLE_CLIENT_ID"
            googleClientSecret="$GOOGLE_CLIENT_SECRET"
            microsoftClientId="$MICROSOFT_CLIENT_ID"
            microsoftClientSecret="$MICROSOFT_CLIENT_SECRET"
            adminUserIds="$ADMIN_USER_IDS"
          )

          if [ -n "${FORWARDED_TRUSTED_PROXIES_JSON:-}" ]; then
            PARAMS+=(forwardedHeadersTrustedProxies="$FORWARDED_TRUSTED_PROXIES_JSON")
          fi
          if [ -n "${FORWARDED_TRUSTED_NETWORKS_JSON:-}" ]; then
            PARAMS+=(forwardedHeadersTrustedNetworks="$FORWARDED_TRUSTED_NETWORKS_JSON")
          fi

          az deployment group create \
            --resource-group $RESOURCE_GROUP \
            --template-file infra/main.bicep \
            --only-show-errors \
            --parameters "${PARAMS[@]}" \
            --output none

      # ------------------------------------------------------------------
      # 6. Bind custom domain (if CUSTOM_DOMAIN secret is set)
      # ------------------------------------------------------------------
      - name: Bind Custom Domain
        if: env.CUSTOM_DOMAIN != ''
        run: |
          set -euo pipefail
          DOMAIN="$CUSTOM_DOMAIN"
          echo "🌐 Binding custom domain: $DOMAIN"
          echo "   App FQDN: ${{ steps.infra.outputs.app_fqdn }}"
          echo "   Verification ID: ${{ steps.infra.outputs.domain_verification_id }}"

          # Add hostname (idempotent — skips if already added)
          az containerapp hostname add \
            --hostname "$DOMAIN" \
            --resource-group $RESOURCE_GROUP \
            --name $APP_NAME 2>/dev/null || true

          # Bind managed certificate (idempotent — skips if already bound)
          az containerapp hostname bind \
            --hostname "$DOMAIN" \
            --resource-group $RESOURCE_GROUP \
            --name $APP_NAME \
            --environment ${{ steps.infra.outputs.env_name }} \
            --validation-method CNAME

          echo "✅ Custom domain bound with managed certificate"

      # ------------------------------------------------------------------
      # 7. Verify deployment
      # ------------------------------------------------------------------
      - name: Verify Health
        run: |
          set -uo pipefail
          APP_URL="${{ steps.infra.outputs.app_url }}"
          echo "🚀 Deployed to: $APP_URL"

          STATUS="000"
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (after $((i*5))s)"
              exit 0
            fi
            echo "  Waiting for health check... (attempt $i, status: $STATUS)"
            sleep 5
          done

          echo "::error::Health check did not return 200 within 120s (last status: $STATUS)"
          exit 1
