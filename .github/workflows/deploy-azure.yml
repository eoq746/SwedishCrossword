name: Deploy application to Azure Container Apps

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/daily-crossword.yml'
      - '.github/workflows/deploy-azure-infra.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - '.github/workflows/daily-crossword.yml'
      - '.github/workflows/deploy-azure-infra.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-svensktkorsord
  APP_NAME: svensktkorsord

jobs:
  detect-changes:
    name: Detect App Deployment Scope
    runs-on: ubuntu-latest
    outputs:
      run_app: ${{ steps.changes.outputs.run_app }}
      reason: ${{ steps.changes.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect app deployment changes
        id: changes
        run: |
          set -euo pipefail
          RUN_APP=false
          REASON='no deployable app changes detected'
          INFRA_REGEX='^(infra/|\.github/workflows/deploy-azure-infra\.yml$|\.github/workflows/azure-quality-gates\.yml$)'
          APP_REGEX='^(frontend/|SwedishCrossword/|SwedishCrossword\.Api/|SwedishCrossword\.Core/|SwedishCrossword\.Api\.Tests/|SwedishCrossword\.Tests/|ClueHandler/|scripts/|Dockerfile$|\.dockerignore$|Directory\.Build\.props$|global\.json$|SwedishCrossword\.sln$|\.github/workflows/deploy-azure-app\.yml$)'

          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            RUN_APP=true
            REASON='manual application deployment'
          else
            if [ "${{ github.event_name }}" = 'pull_request' ]; then
              BASE_SHA='${{ github.event.pull_request.base.sha }}'
              HEAD_SHA='${{ github.event.pull_request.head.sha }}'
            else
              BASE_SHA='${{ github.event.before }}'
              HEAD_SHA='${{ github.sha }}'
            fi

            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            echo 'Changed files considered for application deployment:'
            echo "$CHANGED_FILES"

            if echo "$CHANGED_FILES" | grep -Eq "$INFRA_REGEX"; then
              REASON='infrastructure-related changes are handled by the infrastructure workflow'
            elif echo "$CHANGED_FILES" | grep -Eq "$APP_REGEX"; then
              RUN_APP=true
              REASON='application/runtime files changed'
            fi
          fi

          echo "run_app=$RUN_APP" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Application deployment decision: $REASON"

  checks:
    uses: ./.github/workflows/azure-quality-gates.yml
    secrets: inherit

  deploy-application:
    name: Deploy Application
    if: needs.detect-changes.outputs.run_app == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch')
    needs: [detect-changes, checks]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-azure-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Select subscription (if provided)
        run: |
          if [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          else
            echo "AZURE_SUBSCRIPTION_ID not set; listing subscriptions available to the identity"
            az account list -o table
          fi

      - name: Inspect existing deployment resources
        id: existing
        run: |
          set -euo pipefail
          ACR_NAME=$(az acr list --resource-group "$RESOURCE_GROUP" --query '[0].name' -o tsv 2>/dev/null || true)
          APP_FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || true)

          if [ -z "$ACR_NAME" ] || [ -z "$APP_FQDN" ]; then
            echo '::error::Azure Container App or ACR not found. Run the Deploy Azure infrastructure workflow first.'
            exit 1
          fi

          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "app_url=https://$APP_FQDN" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Generate SBOM
        env:
          SBOM_TOOL_VERSION: '3.1.0'
        run: |
          dotnet publish SwedishCrossword.Api -c Release -o ./publish --nologo
          curl -Lo sbom-tool "https://github.com/microsoft/sbom-tool/releases/download/v${SBOM_TOOL_VERSION}/sbom-tool-linux-x64"
          chmod +x sbom-tool
          mkdir -p ./sbom-output
          ./sbom-tool generate \
            -b ./publish \
            -bc . \
            -pn SwedishCrossword \
            -pv "${{ github.sha }}" \
            -ps SwedishCrossword \
            -nsb "https://github.com/eoq746/SwedishCrossword" \
            -m ./sbom-output \
            -mi "SPDX:2.2"
          rm -rf ./publish

      - name: Generate human-readable SBOM formats
        run: |
          pip install sbom2doc==0.5.1 --quiet
          MANIFEST=$(find ./sbom-output -name "manifest.spdx.json" | head -1)
          sbom2doc -i "$MANIFEST" -o "${MANIFEST}.md" -f markdown
          sbom2doc -i "$MANIFEST" -o "${MANIFEST}.html" -f html

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: sbom-output/_manifest/spdx_2.2/
          retention-days: 90

      - name: Build & Push Image
        run: |
          az acr build \
            --registry ${{ steps.existing.outputs.acr_name }} \
            --image $APP_NAME:${{ github.sha }} \
            --image $APP_NAME:latest \
            .

      - name: Update Container App Image
        run: |
          set -euo pipefail
          ACR_LOGIN=$(az acr show --name "${{ steps.existing.outputs.acr_name }}" --query loginServer -o tsv)
          IMAGE="$ACR_LOGIN/$APP_NAME:${{ github.sha }}"
          echo "Updating Container App image to $IMAGE"
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --image "$IMAGE" \
            --output none

      - name: Verify Health
        timeout-minutes: 8
        env:
          APP_URL: ${{ steps.existing.outputs.app_url }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::App URL output is empty; cannot run health verification."
            exit 1
          fi

          echo "🚀 Deployed to: $APP_URL"

          MAX_ATTEMPTS=84
          SLEEP_SECONDS=5
          MAX_TOTAL_SECONDS=420
          START_TS=$(date +%s)
          READY_STATUS='000'
          LIVE_STATUS='000'

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            LIVE_STATUS=$(timeout 8s curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 3 \
              --max-time 5 \
              "$APP_URL/api/health/live" || true)

            READY_STATUS=$(timeout 8s curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 3 \
              --max-time 5 \
              "$APP_URL/api/health/ready" || true)

            if [ -z "$LIVE_STATUS" ]; then LIVE_STATUS='000'; fi
            if [ -z "$READY_STATUS" ]; then READY_STATUS='000'; fi

            if [ "$READY_STATUS" = '200' ]; then
              ELAPSED=$(( $(date +%s) - START_TS ))
              echo "✅ Health check passed (after ${ELAPSED}s)"
              exit 0
            fi

            ELAPSED=$(( $(date +%s) - START_TS ))
            echo "  Waiting for health check... (attempt $i/$MAX_ATTEMPTS, live: $LIVE_STATUS, ready: $READY_STATUS, elapsed: ${ELAPSED}s)"

            az containerapp revision list \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --query "[].{name:name,active:properties.active,health:properties.healthState,running:properties.runningState,replicas:properties.replicas}" \
              --output table || true

            if [ "$ELAPSED" -ge "$MAX_TOTAL_SECONDS" ]; then
              break
            fi

            sleep "$SLEEP_SECONDS"
          done

          echo "::error::Health check did not return 200 within ${MAX_TOTAL_SECONDS}s (last live: $LIVE_STATUS, ready: $READY_STATUS)"
          echo '--- Recent system logs ---'
          az containerapp logs show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --type system \
            --tail 200 || true

          echo '--- Recent app logs ---'
          az containerapp logs show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --type console \
            --tail 200 || true

          exit 1
