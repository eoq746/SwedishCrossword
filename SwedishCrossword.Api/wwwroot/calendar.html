<body>
    <div class="container">
        <header>
            <nav class="puzzle-nav">

                <a href="/puzzle.html?size=17x17" class="nav-link">🧩 Dagens korsord</a>

            <h1>Korsord-arkiv</h1>
            <p>Välj ett datum för att spela ett tidigare korsord</p>
            <div class="calendar-size-picker" id="calendar-size-picker">
                <label>Storlek:</label>

                <h2 id="calendar-title"></h2>

            </div>
            <div class="calendar-grid" id="calendar-grid">

    <script>
    (function(){
        var s=localStorage.getItem('crossword-theme'),p=window.matchMedia('(prefers-color-scheme:dark)').matches,t=s||(p?'dark':'light');
        document.documentElement.setAttribute('data-theme',t);
        var b=document.getElementById('theme-toggle');
        if(b){b.textContent=t==='dark'?'\u2600\ufe0f':'\ud83c\udf19';b.addEventListener('click',function(){var c=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';localStorage.setItem('crossword-theme',c);document.documentElement.setAttribute('data-theme',c);b.textContent=c==='dark'?'\u2600\ufe0f':'\ud83c\udf19';});}
    })();
    </script>
    <script>
    (function() {
        const MONTHS_SV = ['Januari','Februari','Mars','April','Maj','Juni',
                           'Juli','Augusti','September','Oktober','November','December'];

        let currentYear, currentMonth;
        let availableDateSizes = {}; // { "2025-07-10": ["10x10","17x17"], ... }
        let selectedSize = '17x17';

        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];
        currentYear = today.getFullYear();
        currentMonth = today.getMonth();

        // Restore size from URL hash or default
        const hashSize = window.location.hash.replace('#', '');
        if (['10x10','15x15','17x17'].includes(hashSize)) selectedSize = hashSize;

        async function loadDates() {
            try {
                const res = await fetch('/api/puzzle/dates', { signal: AbortSignal.timeout(10000) });
                if (res.ok) {
                    const data = await res.json();
                    data.forEach(item => {
                        if (typeof item === 'string') {
                            // Legacy: plain date string
                            availableDateSizes[item] = ['17x17'];
                        } else {
                            availableDateSizes[item.date] = item.sizes || [];
                        }
                    });
                }
            } catch (e) {
                console.error('Failed to load puzzle dates', e);
            }
            renderCalendar();
            updateSizeButtons();
        }

        function pad(n) { return n < 10 ? '0' + n : '' + n; }

        function renderCalendar() {
            document.getElementById('calendar-title').textContent =
                `${MONTHS_SV[currentMonth]} ${currentYear}`;

            // Disable next-month button if we're on the current month
            const nextBtn = document.getElementById('next-month');
            nextBtn.disabled = (currentYear === today.getFullYear() && currentMonth >= today.getMonth());

            const grid = document.getElementById('calendar-grid');
            // Remove old day cells (keep the 7 header cells)
            while (grid.children.length > 7) {
                grid.removeChild(grid.lastChild);
            }

            const firstDay = new Date(currentYear, currentMonth, 1);
            // JS: 0=Sun, we want 0=Mon
            let startDow = firstDay.getDay() - 1;
            if (startDow < 0) startDow = 6;

            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Empty cells before first day
            for (let i = 0; i < startDow; i++) {
                const empty = document.createElement('div');
                empty.className = 'calendar-cell calendar-empty';
                grid.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentYear}-${pad(currentMonth + 1)}-${pad(day)}`;
                const cell = document.createElement('div');
                cell.className = 'calendar-cell';
                cell.textContent = day;

                const isToday = dateStr === todayStr;
                const sizes = availableDateSizes[dateStr] || [];
                const hasSelectedSize = sizes.includes(selectedSize) || isToday;
                const hasAnyData = sizes.length > 0;
                const isFuture = new Date(currentYear, currentMonth, day) > today;

                if (isToday) {
                    cell.classList.add('calendar-today');
                }

                if (hasSelectedSize || (isToday && hasAnyData) || isToday) {
                    cell.classList.add('calendar-available');
                    const link = document.createElement('a');
                    link.href = isToday
                        ? `/puzzle.html?size=${selectedSize}`
                        : `/puzzle.html?date=${dateStr}&size=${selectedSize}`;
                    link.className = 'calendar-link';
                    link.textContent = day;
                    link.setAttribute('aria-label', `Spela ${selectedSize} korsord för ${dateStr}`);
                    cell.textContent = '';
                    cell.appendChild(link);
                } else if (isFuture) {
                    cell.classList.add('calendar-future');
                } else if (hasAnyData) {
                    // Has puzzles but not for the selected size — dim but clickable
                    cell.classList.add('calendar-unavailable');
                } else {
                    cell.classList.add('calendar-unavailable');
                }

                grid.appendChild(cell);
            }
        }

        function updateSizeButtons() {
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.size === selectedSize);
            });
        }

        document.getElementById('calendar-size-picker').addEventListener('click', (e) => {
            const btn = e.target.closest('.size-btn');
            if (!btn) return;
            selectedSize = btn.dataset.size;
            window.location.hash = selectedSize;
            updateSizeButtons();
            renderCalendar();
        });

        document.getElementById('prev-month').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            if (currentYear === today.getFullYear() && currentMonth >= today.getMonth()) return;
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        });

        loadDates();
    })();
    </script>
    <script>
    (function(){
        function initAuth(data){
            document.querySelectorAll('.auth-btn-container').forEach(function(c){
                c.innerHTML='';
                if(data && data.authenticated){
                    var a=document.createElement('a');
                    a.href='/profile.html';
                    a.className='auth-user-name';
                    a.textContent=data.name||'Inloggad';
                    a.title='Min profil: '+a.textContent;
                    var btn=document.createElement('button');
                    btn.className='auth-btn auth-btn-logout';
                    btn.textContent='Logga ut';
                    btn.addEventListener('click',function(){fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'}).then(function(){location.reload()})});
                    c.appendChild(a);c.appendChild(btn);
                }else{
                    var ret=encodeURIComponent(location.pathname+location.search);
                    var loginBtn=document.createElement('button');
                    loginBtn.className='auth-btn';
                    loginBtn.textContent='Logga in';
                    var menu=document.createElement('div');
                    menu.className='auth-login-menu';
                    menu.innerHTML='<a href="/api/auth/login/google?returnUrl='+ret+'">Logga in med Google</a><a href="/api/auth/login/microsoft?returnUrl='+ret+'">Logga in med Microsoft</a>';
                    loginBtn.addEventListener('click',function(){menu.classList.toggle('auth-menu-open')});
                    c.appendChild(loginBtn);c.appendChild(menu);
                }
            });
        }
        fetch('/api/auth/me',{credentials:'same-origin'}).then(function(r){return r.json()}).then(initAuth).catch(function(){initAuth(null)});
    })();
    </script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister()})});caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})});</script>
