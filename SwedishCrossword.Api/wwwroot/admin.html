<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Svenskt Korsord</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preload" href="/site.min.css" as="style">
    <link rel="stylesheet" href="/site.min.css">

    <style nonce="__CSP_NONCE__">
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--page-bg);
            min-height: 100vh;
            padding: env(safe-area-inset-top,20px) env(safe-area-inset-right,20px) env(safe-area-inset-bottom,20px) env(safe-area-inset-left,20px);
            display: flex; align-items: flex-start; justify-content: center; line-height: 1.7;
        }
        .container {
            width: 100%; max-width: 1100px; margin: 20px auto;
            background: var(--card-bg); border-radius: 12px; padding: 32px;
            box-shadow: 0 10px 40px var(--shadow); overflow: auto;
        }
        .page-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .theme-toggle {
            background: none; border: none; font-size: 1.5rem; cursor: pointer;
            padding: 4px 8px; border-radius: 8px; transition: transform 0.2s;
        }
        .theme-toggle:hover { transform: scale(1.15); }
        h1 { color: var(--text-heading); margin-bottom: 12px; font-size: 1.8rem }
        h2 { color: var(--accent); margin-top: 28px; margin-bottom: 14px; font-size: 1.25rem }
        p { color: var(--text-body); margin-bottom: 14px }
        a { color: var(--accent) }
        a:hover { text-decoration: underline }
        .back-link {
            display: inline-block; margin-top: 24px; padding: 10px 16px;
            background: var(--accent); color: #fff; border-radius: 8px;
            text-decoration: none; font-weight: 600;
        }
        .back-link:hover { background: var(--accent-hover) }
        footer { text-align: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.9rem }
        footer a { color: var(--text-muted); margin: 0 10px }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px,100%), 1fr));
            gap: 12px; margin: 20px 0;
        }
        .stat-card {
            background: var(--surface-bg); padding: 16px; border-radius: 10px;
            border: 1px solid var(--border); text-align: center;
        }
        .stat-card .value { font-size: 1.6rem; font-weight: 700; color: var(--accent); display: block; }
        .stat-card .label { font-size: 0.85rem; color: var(--text-muted); }

        .loading { text-align: center; padding: 40px; color: var(--text-muted); font-style: italic; }
        .error-msg { color: var(--danger); text-align: center; padding: 40px; font-weight: 600; }

        table { width: 100%; border-collapse: collapse; margin: 12px 0; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); color: var(--text-body); font-size: 0.95rem; }
        th { color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        tr:last-child td { border-bottom: none; }

        .daily-bar-row { display: flex; align-items: center; gap: 8px; }
        .daily-bar {
            height: 18px; border-radius: 4px; background: var(--accent);
            min-width: 2px; transition: width 0.3s;
        }
        .daily-bar-label { font-variant-numeric: tabular-nums; min-width: 32px; text-align: right; }

        .section { background: var(--surface-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-top: 20px; }
        .section h2 { margin-top: 0; }

        .refresh-btn {
            padding: 6px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text-body); cursor: pointer;
            font-size: 0.9rem; transition: background 0.2s;
        }
        .refresh-btn:hover { background: var(--surface-bg); }

        @media(max-width:600px) {
            .container { padding: 20px; width: calc(100% - 16px); margin: 12px auto }
            h1 { font-size: 1.5rem }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            footer nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; }
        }
    </style>
</head>
<body>
    <a href="#content" class="skip-link" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;z-index:999;">Hoppa till innehåll</a>
    <div class="container">
        <div class="page-nav">
            <a href="/" class="page-nav-link">← Startsida</a>
            <div style="display:flex;gap:8px;align-items:center;">
                <button class="refresh-btn" id="refresh-btn" title="Uppdatera">🔄 Uppdatera</button>
                <button class="theme-toggle" id="theme-toggle" aria-label="Byt tema" title="Byt ljust/mörkt tema">🌙</button>
            </div>
        </div>

        <main id="content" role="main">
            <div class="loading">Laddar adminpanel...</div>
        </main>

        <footer role="contentinfo">
            <nav>
                <a href="/">Startsida</a>
                <a href="/profile.html">Min profil</a>
                <a href="/about.html">Om oss</a>
            </nav>
            © 2025–2026 Svenskt Korsord. Alla rättigheter förbehållna.
        </footer>
    </div>

<script nonce="__CSP_NONCE__">
(function(){
    var s=localStorage.getItem('crossword-theme'),p=window.matchMedia('(prefers-color-scheme:dark)').matches,t=s||(p?'dark':'light');
    document.documentElement.setAttribute('data-theme',t);
    var b=document.getElementById('theme-toggle');
    if(b){b.textContent=t==='dark'?'\u2600\ufe0f':'\ud83c\udf19';b.addEventListener('click',function(){var c=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';localStorage.setItem('crossword-theme',c);document.documentElement.setAttribute('data-theme',c);b.textContent=c==='dark'?'\u2600\ufe0f':'\ud83c\udf19';});}
})();

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function loadAdmin() {
    var content = document.getElementById('content');
    try {
        var summaryRes = fetch('/api/analytics/summary', { credentials: 'same-origin', signal: AbortSignal.timeout(10000) });
        var dailyRes = fetch('/api/analytics/daily?days=30', { credentials: 'same-origin', signal: AbortSignal.timeout(10000) });
        var playersRes = fetch('/api/analytics/players?limit=20', { credentials: 'same-origin', signal: AbortSignal.timeout(10000) });

        var [sRes, dRes, pRes] = await Promise.all([summaryRes, dailyRes, playersRes]);

        if (sRes.status === 401 || sRes.status === 403) {
            content.innerHTML = '<div class="error-msg">⛔ Åtkomst nekad. Du måste vara inloggad som admin.</div>' +
                '<div style="text-align:center"><a href="/profile.html" class="back-link">Gå till profil</a></div>';
            return;
        }

        if (!sRes.ok || !dRes.ok || !pRes.ok) {
            content.innerHTML = '<div class="error-msg">Kunde inte ladda data. Kontrollera att API:et är igång.</div>';
            return;
        }

        var summary = await sRes.json();
        var daily = await dRes.json();
        var players = await pRes.json();

        renderDashboard(content, summary, daily, players);
    } catch (e) {
        console.error('Admin load failed:', e);
        content.innerHTML = '<div class="error-msg">Något gick fel. Försök igen senare.</div>' +
            '<a href="/" class="back-link" style="display:block;text-align:center;margin:20px auto;width:fit-content;">← Tillbaka</a>';
    }
}

function formatTime(s) {
    if (s == null) return '–';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
}

var SIZE_LABELS = { '10x10': 'Liten (10×10)', '15x15': 'Mellan (15×15)', '17x17': 'Stor (17×17)' };

function renderDashboard(el, summary, daily, players) {
    var html = '<h1>🔧 Adminpanel</h1>';

    // Summary cards
    html += '<div class="stats-grid">';
    var cards = [
        { label: 'Lösningar idag', value: summary.completionsToday ?? '–' },
        { label: 'Aktiva idag', value: summary.activeToday ?? '–' },
        { label: 'Totalt lösningar', value: summary.totalCompletions ?? '–' },
        { label: 'Unika spelare', value: summary.uniquePlayers ?? '–' },
        { label: 'Registrerade', value: summary.registeredUsers ?? '–' },
        { label: 'Snittid', value: formatTime(summary.averageTime) },
        { label: 'Bästa tid', value: formatTime(summary.bestTime) },
        { label: 'Ledtrådsandel', value: summary.hintUsageRate != null ? Math.round(summary.hintUsageRate * 100) + '%' : '–' }
    ];
    for (var i = 0; i < cards.length; i++) {
        html += '<div class="stat-card"><span class="value">' + esc(String(cards[i].value)) + '</span><span class="label">' + esc(cards[i].label) + '</span></div>';
    }
    html += '</div>';

    // Per-size breakdown
    if (summary.perSize && Object.keys(summary.perSize).length > 0) {
        html += '<div class="section"><h2>📐 Per pusselstorlek</h2>';
        html += '<div class="stats-grid">';
        Object.entries(summary.perSize).forEach(function(entry) {
            var sizeKey = entry[0], s = entry[1];
            var label = SIZE_LABELS[sizeKey] || sizeKey;
            html += '<div class="stat-card"><span class="value">' + s.completions + '</span><span class="label">' + esc(label) + ' · snitt ' + formatTime(s.averageTime) + '</span></div>';
        });
        html += '</div></div>';
    }

    // Daily activity
    html += '<div class="section"><h2>📊 Daglig aktivitet (senaste 30 dagar)</h2>';
    if (daily && daily.length > 0) {
        var maxCount = Math.max.apply(null, daily.map(function(d) { return d.completions || 0; }));
        html += '<table><thead><tr><th>Datum</th><th>Lösningar</th><th>Spelare</th><th>Snittid</th><th style="width:40%"></th></tr></thead><tbody>';
        for (var j = 0; j < daily.length; j++) {
            var d = daily[j];
            var count = d.completions || 0;
            var pct = maxCount > 0 ? Math.round((count / maxCount) * 100) : 0;
            html += '<tr><td>' + esc(d.date || '–') + '</td><td class="daily-bar-label">' + count + '</td>' +
                '<td>' + (d.uniquePlayers || 0) + '</td><td>' + formatTime(d.averageTime) + '</td>' +
                '<td><div class="daily-bar-row"><div class="daily-bar" style="width:' + pct + '%"></div></div></td></tr>';
        }
        html += '</tbody></table>';
    } else {
        html += '<p style="color:var(--text-muted);font-style:italic;">Ingen data.</p>';
    }
    html += '</div>';

    // Top players
    html += '<div class="section"><h2>🏆 Topspelare</h2>';
    if (players && players.length > 0) {
        html += '<table><thead><tr><th>#</th><th>Spelare</th><th>Lösningar</th><th>Snittid</th><th>Bästa tid</th></tr></thead><tbody>';
        for (var k = 0; k < players.length; k++) {
            var p = players[k];
            var badge = p.verified ? ' <span title="Verifierat konto" style="color:var(--accent);font-size:0.85em;">✓</span>' : ' <span title="Gäst" style="color:var(--text-muted);font-size:0.85em;">👤</span>';
            html += '<tr><td>' + (k + 1) + '</td><td>' + esc(p.displayName || p.rawName || '–') + badge + '</td><td>' + (p.gamesPlayed || 0) + '</td><td>' + formatTime(p.averageTime) + '</td><td>' + formatTime(p.bestTime) + '</td></tr>';
        }
        html += '</tbody></table>';
    } else {
        html += '<p style="color:var(--text-muted);font-style:italic;">Inga spelare.</p>';
    }
    html += '</div>';

    el.innerHTML = html;
}

document.getElementById('refresh-btn').addEventListener('click', function() { loadAdmin(); });
loadAdmin();
</script>
<script nonce="__CSP_NONCE__" src="/cookie-consent.js" defer></script>
<script nonce="__CSP_NONCE__">if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister()})});caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})});</script>
</body>
</html>
